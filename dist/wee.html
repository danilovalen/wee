<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wee</title>
  <style>
:root {
  --bg: #0d0f15; --panel: #161a24; --line: #262c3b; --text: #e9edf5; --dim: #8e98ad;
  --accent: #5ee0e6; --radius: 8px;
}
* { box-sizing: border-box; }
html, body { overscroll-behavior: none; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.logo { font-size: 18px; letter-spacing: 1px; margin-right: 8px; }
.spacer { flex: 1; }
button {
  font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 6px 12px; cursor: pointer; transition: background .12s, border-color .12s;
}
button:hover { border-color: var(--dim); }
button.on { border-color: var(--accent); background: #183238; }
button:disabled { opacity: .4; cursor: default; }
#mode { min-width: 72px; }
main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 260px; gap: 16px; padding: 16px; align-items: start; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 4px 0 8px; }
h2:not(:first-child) { margin-top: 16px; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-bottom: 8px; }
.tabs button { padding: 5px 0; min-width: 0; font-size: 12px; position: relative; }
.tabs button.holds::after { content: ''; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.grid button[hidden] { display: none; }
.ghead { display: none; grid-column: 1 / -1; margin: 8px 0 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
.ghead:first-child { margin-top: 0; }
/* Wide screens show every section at once; the tabs are for phones. */
@media (min-width: 901px) {
  .tabs, #tools > h2:first-child { display: none; }
  .ghead { display: block; }
  .grid button[hidden] { display: flex; }
  .grid button { white-space: nowrap; padding: 4px 6px; font-size: 12.5px; }
  .grid canvas { width: 18px; height: 18px; }
  .ghead { margin-top: 6px; }
}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid button { min-width: 0; text-align: left; display: flex; align-items: center; gap: 6px; padding: 5px 6px; font-size: 13px; }
.grid canvas { width: 20px; height: 20px; flex: none; }
.opt[hidden] { display: none; }
.opt { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 10px; }
.opt > span:first-child { width: 100%; color: var(--dim); font-size: 12px; }
.opt button { padding: 4px 8px; font-size: 12px; }
.opt [data-aim], .opt [data-corner], .opt [data-pass], .opt [data-face] { width: 32px; padding: 4px 0; font-size: 15px; }
.opt .note { width: 100%; color: var(--dim); font-size: 12px; }
#colours { display: flex; gap: 6px; }
#colours button { width: 26px; height: 26px; padding: 0; border-radius: 50%; border-width: 2px; }
.size { display: flex; gap: 8px; }
.size label { display: flex; flex-direction: column; gap: 2px; color: var(--dim); font-size: 12px; }
.size input { width: 64px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
#keys:empty { display: none; }
.hint { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
#stage { display: flex; flex-direction: column; align-items: center; min-width: 0; }
#game { display: block; border-radius: var(--radius); border: 1px solid var(--line); image-rendering: auto; touch-action: none; }
body.play #tools { opacity: .45; pointer-events: none; }
.power { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.power:last-child { border-bottom: 0; }
.power b { font-weight: 600; }
.power small { grid-column: 2; color: var(--dim); }
.power.off { cursor: default; opacity: .45; }
.radio { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }
button { touch-action: manipulation; }
.pad { display: flex; gap: 8px; margin-top: 10px; width: 100%; max-width: 480px; }
.pad[hidden] { display: none; }
.pad { flex-wrap: wrap; }
.pad button { flex: 1 1 30%; min-height: 48px; font-size: 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } #stage { order: -1; } }
@media (max-width: 700px) {
  body { font-size: 15px; }
  header { padding: 8px 12px; }
  main { padding: 12px; gap: 12px; }
  header button { min-height: 40px; }
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .grid button { flex-direction: column; justify-content: center; text-align: center; gap: 2px; padding: 4px 2px; font-size: 11px; line-height: 1.15; }
  aside { padding: 10px; }
  .hint { margin-top: 6px; }
  .opt button { min-height: 40px; }
  .opt [data-aim], .opt [data-corner], .opt [data-pass], .opt [data-face] { width: 44px; }
  /* A phone shows the room and the whole palette with its options without scrolling. */
  #tools > h2:first-child { display: none; }
  .opt { margin-top: 6px; }
  .opt > span:first-child { font-size: 11.5px; }
  .tabs { margin-bottom: 6px; }
  #colours button { width: 36px; height: 36px; }
  .power { padding: 10px 0; }
  .radio { padding: 8px 0; }
}
button.on:disabled { opacity: 1; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); width: min(92vw, 520px); }
dialog textarea { width: 100%; font: 12px monospace; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
dialog::backdrop { background: rgba(0,0,0,.6); }
</style>
</head>
<body>
  <header>
    <b class="logo">wee</b>
    <button id="mode" type="button" title="E">Play</button>
    <span class="spacer"></span>
    <button id="sample" type="button">Sample</button>
    <button id="save" type="button">Save</button>
    <button id="open" type="button">Open</button>
    <input id="file" type="file" accept=".wee,.json" hidden>
  </header>
  <main>
    <aside id="tools">
      <h2>Build</h2>
      <div id="groups" class="tabs" role="tablist"></div>
      <div id="palette" class="grid"></div>
      <div id="options">
        <div class="opt" data-for="mover enemy strong" id="axisOpt">
          <span>Moves</span>
          <button type="button" data-axis="h">Across</button>
          <button type="button" data-axis="v">Up and down</button>
        </div>
        <div class="opt" data-for="mover enemy strong turret">
          <span>Clock</span>
          <button type="button" data-mode="realtime">Real time</button>
          <button type="button" data-mode="input">On your move</button>
          <button type="button" data-mode="follow">Same way as you</button>
        </div>
        <div class="opt" data-for="turret">
          <span>Fires, one at a time, clockwise</span>
          <button type="button" data-aim="up" title="Up">&uarr;</button>
          <button type="button" data-aim="right" title="Right">&rarr;</button>
          <button type="button" data-aim="down" title="Down">&darr;</button>
          <button type="button" data-aim="left" title="Left">&larr;</button>
          <small class="note">Place it on a box, a heavy box or an enemy to mount it there.</small>
        </div>
        <div class="opt" data-for="spring">
          <span>Faces</span>
          <button type="button" data-face="up" title="Up">&uarr;</button>
          <button type="button" data-face="right" title="Right">&rarr;</button>
          <button type="button" data-face="down" title="Down">&darr;</button>
          <button type="button" data-face="left" title="Left">&larr;</button>
        </div>
        <div class="opt" data-for="gate">
          <span>Lets things through going</span>
          <button type="button" data-pass="up" title="Up">&uarr;</button>
          <button type="button" data-pass="right" title="Right">&rarr;</button>
          <button type="button" data-pass="down" title="Down">&darr;</button>
          <button type="button" data-pass="left" title="Left">&larr;</button>
        </div>
        <div class="opt" data-for="tri">
          <span>Solid corner</span>
          <button type="button" data-corner="nw" title="Top left">&#9700;</button>
          <button type="button" data-corner="ne" title="Top right">&#9701;</button>
          <button type="button" data-corner="sw" title="Bottom left">&#9699;</button>
          <button type="button" data-corner="se" title="Bottom right">&#9698;</button>
        </div>
        <div class="opt" data-for="button door receiver sensor">
          <span>Colour</span>
          <span id="colours"></span>
        </div>
      </div>
      <h2>Room</h2>
      <div class="size">
        <label>Width <input id="w" type="number" min="5" max="40"></label>
        <label>Height <input id="h" type="number" min="5" max="30"></label>
      </div>
      <p id="placeHint" class="hint"></p>
    </aside>
    <section id="stage">
      <canvas id="game"></canvas>
      <div id="pad" class="pad" hidden>
        <button id="hideBtn" type="button">Hide / Swim</button>
        <button id="respawnBtn" type="button">Reset</button>
        <button id="reportBtn" type="button">Copy report</button>
      </div>
      <dialog id="reportBox">
        <p>Copy all of this and paste it in the chat.</p>
        <textarea id="reportText" rows="8" readonly></textarea>
        <form method="dialog"><button>Close</button></form>
      </dialog>
      <p id="keys" class="hint"></p>
    </section>
    <aside id="powers">
      <h2>Powers</h2>
      <div id="powerList"></div>
      <h2>Status</h2>
      <div id="statusList"></div>
      <h2>World moves</h2>
      <label class="radio"><input type="radio" name="clock" value="tile"> Each tile you slide</label>
      <label class="radio"><input type="radio" name="clock" value="slide"> Each slide</label>
    </aside>
  </main>
  <script type="module">
// ---- src/rules/base.js
const m0 = (() => {

// The rules' vocabulary: directions, colours, piece kinds, timings and the small tables
// every other rules file reads.

const TICK_MS = 60;
const RT_PERIOD = 6;
// Hiding lasts at least this long, and until every piece the hide sent sliding has stopped.
const HIDE_TICKS = 4;
const LASER_TICKS = 5;

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

const COLOURS = ['red', 'blue', 'yellow', 'green'];

// A triangle ('tri:se') is solid in that corner; its other two faces are open. What
// enters through one open face leaves through the other, turned 90 degrees.
const CORNERS = ['nw', 'ne', 'sw', 'se'];
const EXIT_FACE = { up: 'n', down: 's', left: 'w', right: 'e' };
const ENTRY_FACE = { up: 's', down: 'n', left: 'e', right: 'w' };
const OUT = { n: 'up', s: 'down', e: 'right', w: 'left' };
const OPP = { n: 's', s: 'n', e: 'w', w: 'e' };
const openFaces = corner => [OPP[corner[0]], OPP[corner[1]]];
const turn = (corner, d) => OUT[openFaces(corner).find(f => f !== ENTRY_FACE[d])];



// Clockwise order: a turret fires its chosen directions in this order.
const CLOCKWISE = ['up', 'right', 'down', 'left'];
const KINDS = ['mover', 'enemy', 'strong', 'box', 'heavy', 'turret'];
const MOVES = ['mover', 'enemy', 'strong'];
const ENEMY = ['enemy', 'strong'];
// realtime: on its own clock; input: on each world step; follow: on each world step,
// the same way the player moved.
const MODES = ['realtime', 'input', 'follow'];
// A turret can stand alone or ride one of these.
const CARRIES_TURRET = ['box', 'heavy', 'enemy', 'strong'];

// A power listed in NEEDS cannot act until its block type exists.
const POWERS = ['boomerang', 'dive', 'laser', 'cycle', 'hook', 'swim', 'light', 'armored'];
const NEEDS = { hook: 'grapple tiles', light: 'dark levels' };

// Water stops you unless you are swimming, and stops weak enemies, light boxes and
// lone turrets. Strong enemies, heavy boxes and blocks go through it.
const WADES = ['strong', 'heavy', 'mover'];
const wades = e => WADES.includes(e.kind);
// A closing door squashes what is in it, unless one of these holds it open.
const HOLDS_DOOR = ['strong', 'heavy', 'mover'];

const DIR_OF = (dx, dy) => Object.keys(DIRS).find(k => DIRS[k][0] === dx && DIRS[k][1] === dy);
return { TICK_MS, RT_PERIOD, HIDE_TICKS, LASER_TICKS, DIRS, OPPOSITE, COLOURS, CORNERS, EXIT_FACE, ENTRY_FACE, OUT, OPP, openFaces, turn, CLOCKWISE, KINDS, MOVES, ENEMY, MODES, CARRIES_TURRET, POWERS, NEEDS, WADES, wades, HOLDS_DOOR, DIR_OF };
})();
// ---- src/rules/grid.js
const m1 = (() => {
const { DIRS, DIR_OF, ENTRY_FACE, EXIT_FACE, openFaces, turn } = m0;
// Geometry: what is on a tile, and where one step from a tile lands (walls, doors,
// triangles, one-way tiles, water).

const inb = (s, x, y) => x >= 0 && y >= 0 && x < s.w && y < s.h;
const cellAt = (s, x, y) => s.cells[y * s.w + x];

function solidCell(s, x, y) {
  if (!inb(s, x, y)) return true;
  const c = cellAt(s, x, y);
  if (c === 'wall' || c.startsWith('receiver:') || c.startsWith('spring:')) return true;
  if (c.startsWith('door:')) return !s.open[c.slice(5)];
  return false;
}

const triAt = (s, x, y) => { const c = inb(s, x, y) && cellAt(s, x, y); return c && c.startsWith('tri:') ? c.slice(4) : null; };

// One step from (x, y) going d: where it lands and the way it went, or null when a
// wall, a closed door or a triangle's solid side is in the way. The turn happens on
// the way out: inside a triangle, heading into its solid side sends you along the slope.
function facing(s, x, y, d) {
  const here = triAt(s, x, y);
  return here && !openFaces(here).includes(EXIT_FACE[d]) ? turn(here, d) : d;
}

// A one-way tile ('gate:right', 'gate:right,left') lets things move onto it and off
// it only along its listed directions; any other way, it is a wall.
const gateAt = (s, x, y) => { const c = inb(s, x, y) && cellAt(s, x, y); return c && c.startsWith('gate:') ? c.slice(5).split(',') : null; };

// wet: whether this mover may enter water (beams always may).
function stepTo(s, x, y, d, wet = true) {
  d = facing(s, x, y, d);
  const [dx, dy] = DIRS[d], nx = x + dx, ny = y + dy;
  const from = gateAt(s, x, y), to = gateAt(s, nx, ny);
  if ((from && !from.includes(d)) || (to && !to.includes(d))) return null;
  if (solidCell(s, nx, ny)) return null;
  if (!wet && cellAt(s, nx, ny) === 'water') return null;
  if (cellAt(s, nx, ny) === 'death') return { x: nx, y: ny, d, death: true };
  const tri = triAt(s, nx, ny);
  if (tri && !openFaces(tri).includes(ENTRY_FACE[d])) return null;
  return { x: nx, y: ny, d };
}

// Where a piece at (x, y) pushed d would go, if that tile is free. A death block
// always takes it.
function pushTo(s, x, y, d, wet) {
  const t = stepTo(s, x, y, d, wet);
  return t && (t.death || (!entAt(s, t.x, t.y) && !playerAt(s, t.x, t.y))) ? t : null;
}

const inWater = (s, x, y) => inb(s, x, y) && cellAt(s, x, y) === 'water';

const entAt = (s, x, y, not) => s.entities.find(e => !e.dead && e !== not && e.x === x && e.y === y);
// A hidden player is not on the board: nothing meets it, nothing stops at it.
const playerAt = (s, x, y) => !s.player.hidden && s.player.x === x && s.player.y === y;
// Armored, only the heavy things crush you: a strong enemy and a heavy box.
const crushes = (s, e) => e.kind === 'heavy' || e.kind === 'strong' || !s.powers.armored;
// Where a piece lands moved straight by (dx, dy), or null if it cannot go.
function shift(s, x, y, dx, dy, wet, not) {
  const t = stepTo(s, x, y, DIR_OF(dx, dy), wet);
  if (!t || t.x !== x + dx || t.y !== y + dy) return null;
  if (!t.death && entAt(s, t.x, t.y, not)) return null;
  return t;
}
return { inb, cellAt, solidCell, triAt, facing, gateAt, stepTo, pushTo, inWater, entAt, playerAt, crushes, shift };
})();
// ---- src/rules/life.js
const m2 = (() => {
const { CLOCKWISE, COLOURS, HOLDS_DOOR } = m0;
const { entAt, playerAt } = m1;
// Doors and switches, dying, and the room reset.


// The room's pieces as the level places them; a reset builds them again from here.
const freshPieces = list => list.map((e, i) => ({
  id: i + 1, kind: e.kind, x: e.x, y: e.y,
  axis: e.axis || 'h', dir: e.dir || 1, mode: e.mode || 'input', slide: null, dead: false, rush: false,
  turret: e.turret ? { dirs: CLOCKWISE.filter(d => e.turret.dirs.includes(d)), mode: e.turret.mode, aim: 0 } : null,
}));

// A colour's doors open only while every button, receiver and sensor of that colour
// is held. A closing door squashes you, weak enemies, boxes and lone turrets, unless a
// strong enemy, a heavy box or a block stands in it (or you, armored): then it stays open.
function refreshDoors(s) {
  const pressed = {}, any = {};
  // A receiver or a sensor is a button that a turret beam holds down.
  s.cells.forEach((c, i) => {
    const x = i % s.w, y = (i - x) / s.w;
    let col, down;
    if (c.startsWith('button:')) { col = c.slice(7); down = playerAt(s, x, y) || !!entAt(s, x, y); }
    else if (c.startsWith('receiver:')) { col = c.slice(9); down = s.lit.has(i); }
    else if (c.startsWith('sensor:')) { col = c.slice(7); down = s.lit.has(i); }
    else return;
    any[col] = true;
    pressed[col] = (pressed[col] ?? true) && down;
  });
  let squashed = false;
  for (const col of COLOURS) {
    const want = !!(any[col] && pressed[col]);
    if (!want && s.open[col]) {
      const doors = [];
      s.cells.forEach((c, i) => { if (c === 'door:' + col) doors.push([i % s.w, Math.floor(i / s.w)]); });
      const inside = ([x, y]) => s.entities.filter(e => !e.dead && e.x === x && e.y === y);
      const youIn = ([x, y]) => s.player.x === x && s.player.y === y;
      if (doors.some(d => inside(d).some(e => HOLDS_DOOR.includes(e.kind)) || (youIn(d) && s.powers.armored))) continue;
      for (const d of doors) {
        for (const e of inside(d)) kill(s, e, 'door');
        if (youIn(d) && !s.player.hidden) squashed = true;
      }
    }
    s.open[col] = want;
  }
  if (squashed) { s.events.push({ type: 'squash', x: s.player.x, y: s.player.y }); die(s); }
}

// Dying or pressing Reset puts the whole room back as it started, with you on your last
// checkpoint. Pieces still moving this tick are left behind, marked dead.
function respawn(s) {
  for (const e of s.entities) e.dead = true;
  s.entities = freshPieces(s.origin);
  Object.assign(s.player, { x: s.checkpoint.x, y: s.checkpoint.y, dir: null, moved: 0, hidden: false, hideTicks: 0, sticky: false, stuck: null, pushing: null, snap: true });
  refreshDoors(s);
}

function die(s) {
  s.events.push({ type: 'die', x: s.player.x, y: s.player.y });
  s.deaths++;
  respawn(s);
}

function kill(s, e, how) {
  e.dead = true;
  s.events.push({ type: 'kill', id: e.id, how });
}

// Puts a piece on t, or destroys it when t is a death block.
function land(s, e, t) {
  if (t.death) { kill(s, e, 'death'); return false; }
  e.x = t.x; e.y = t.y;
  return true;
}
return { freshPieces, refreshDoors, respawn, die, kill, land };
})();
// ---- src/rules/beams.js
const m3 = (() => {
const { DIRS } = m0;
const { cellAt, entAt, facing, inWater, inb, playerAt, stepTo } = m1;
const { die, kill } = m2;
// Lasers: your shot, turret beams, relays, catchers and shocked water.



// A beam from (x, y) heading d, turned by triangles. hit(piece) says whether it
// passes on. Returns the cells it crossed, whether geometry stopped it (and the
// cell that did), and whether it reached you.
function trace(s, x, y, d, hit, hitsPlayer) {
  const path = [[x, y]];
  let cx = x, cy = y, cd = d, wall = true, stop = null, player = false;
  for (let i = 0; i < s.w * s.h * 2; i++) {
    const t = stepTo(s, cx, cy, cd);
    if (!t || t.death) { cd = facing(s, cx, cy, cd); stop = [cx + DIRS[cd][0], cy + DIRS[cd][1]]; break; }
    path.push([t.x, t.y]);
    if (hitsPlayer && playerAt(s, t.x, t.y)) { wall = false; player = true; break; }
    const o = entAt(s, t.x, t.y);
    if (o && !hit(o)) { wall = false; break; }
    cx = t.x; cy = t.y; cd = t.d;
  }
  return { path, wall, end: cd, stop, player };
}

// Any laser kills a weak enemy and goes on. Everything else stops it, and a strong
// enemy takes no harm from it.
function laserHit(s, o, how) {
  if (o.kind === 'enemy') { kill(s, o, how); return true; }
  return false;
}

function laser(s, d) {
  const r = trace(s, s.player.x, s.player.y, d, o => laserHit(s, o, 'laser'), false);
  const pools = shockPools(s, r.path);
  s.events.push({ type: 'laser', d, ...r, shocked: [...pools] });
  if (shockHarms(s, pools, 'laser')) die(s);
}

// Every body of water a beam touches: the cells joined to it side by side.
function shockPools(s, path) {
  const out = new Set(), todo = path.filter(([x, y]) => inWater(s, x, y)).map(([x, y]) => y * s.w + x);
  while (todo.length) {
    const i = todo.pop();
    if (out.has(i)) continue;
    out.add(i);
    const x = i % s.w, y = (i - x) / s.w;
    for (const [dx, dy] of Object.values(DIRS)) if (inWater(s, x + dx, y + dy)) todo.push((y + dy) * s.w + x + dx);
  }
  return out;
}
