<title>wee Look Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asap:wght@400;600;700&family=Outfit:wght@200;300;400;800&family=Fredoka:wght@300;400;600&display=swap">
<style>
/* Layout: one column of Drift variants, each an editor strip that plays by itself. Dark only: wee's room is dark. */
:root {
  color-scheme: dark;
  --paper: #050508; --panel: #151518; --ink: #f8fafc; --soft: #a1a1aa;
  --accent: #ff2a5f; --on-accent: #fff; --sticker: #0b0b0e;
  --ice: #5ee0e6; --frost: #eaf6ff; --goal: #f2c14e; --floor: #14171f; --wall: #3a4256; --wallTop: #4d5770;
  --r-s: 8px; --r-m: 10px; --r-l: 16px; --r-pill: 999px;
  --body: 'Asap', 'Helvetica Neue', Arial, sans-serif;
  --head: 'Outfit', 'Asap', sans-serif;
  --round: 'Fredoka', 'Asap', sans-serif;
}
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); }
main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 32px; }
h1 { font: 800 30px/1.1 var(--head); margin: 0; text-wrap: balance; }
.lede { color: var(--soft); margin: 6px 0 0; max-width: 62ch; }
.dir { display: grid; gap: 12px; }
.dir header h2 { font: 800 22px/1.2 var(--head); margin: 0; }
.dir header p { margin: 2px 0 0; color: var(--soft); max-width: 62ch; }
.dir ul { margin: 0; padding-left: 18px; color: var(--soft); font-size: 14px; }
.dir ul b { color: var(--ink); font-weight: 600; }

/* The editor strip in Manga's form, frosted over a snow layer that fills the whole card. */
.ed { position: relative; border-radius: var(--r-l); overflow: hidden; box-shadow: 4px 4px 0 0 var(--sticker); background: #0a0b10; }
.ed > .snow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.ed > :not(.snow) { position: relative; z-index: 1; }
.bar, .status, .ctxline { background: color-mix(in srgb, var(--panel) var(--frost-mix, 78%), transparent); backdrop-filter: blur(var(--blur, 6px)); -webkit-backdrop-filter: blur(var(--blur, 6px)); }
.bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex-wrap: wrap; }
.ctxline { color: var(--soft); font-size: 13px; padding: 6px 12px 10px; }
.btn { font: 600 13px var(--body); color: var(--ink); background: color-mix(in srgb, var(--panel) 60%, #fff 8%); border: 0; border-radius: var(--r-s); padding: 7px 12px;
  box-shadow: 4px 4px 0 0 var(--sticker); transition: transform .08s, box-shadow .08s; }
.btn.pressing { transform: none; box-shadow: 1px 1px 0 0 var(--sticker); }
.btn.on { box-shadow: inset 0 0 0 2px var(--accent), 4px 4px 0 0 var(--sticker); color: var(--accent); }
.stage { display: grid; place-items: center; padding: 18px 12px; }
.room { display: grid; grid-template-columns: repeat(7, 34px); grid-template-rows: repeat(4, 34px); gap: 2px; position: relative; }
.t { background: var(--floor); border-radius: 3px; }
.t.w { background: linear-gradient(var(--wallTop) 0 30%, var(--wall) 30%); border-radius: 6px; }
.goal { display: grid; place-items: center; color: var(--goal); font-size: 18px; }
.p { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--ice); left: 4px; top: 4px; z-index: 3; }
.p::before, .p::after { content: ''; position: absolute; top: 9px; width: 4px; height: 6px; border-radius: 2px; background: #10131b; }
.p::before { left: 8px; } .p::after { right: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 10px; }
.chip { font: 600 12px var(--body); border-radius: var(--r-pill); padding: 4px 10px; background: color-mix(in srgb, var(--panel) 70%, #fff 6%); color: var(--soft); box-shadow: 3px 3px 0 0 var(--sticker); }
.chip.on { color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent), 3px 3px 0 0 var(--sticker); }
.status { display: flex; gap: 10px; align-items: center; padding: 10px 12px; font-size: 13px; color: var(--soft); flex-wrap: wrap; }
.status b { color: var(--ink); }
.led { width: 8px; height: 8px; border-radius: 50%; background: #46c37b; }
.trail { position: absolute; pointer-events: none; z-index: 2; }

/* C1 Drift: the first sketch. Thin spaced wordmark with a passing sheen; a fading ghost behind a slide. */
.C1 .logo { font: 300 24px var(--head); letter-spacing: .12em; background: linear-gradient(100deg, var(--ink) 40%, var(--ice) 50%, var(--ink) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 4s linear infinite; }
@keyframes sheen { to { background-position: -300% 0; } }
.C1 .trail { width: 26px; height: 26px; border-radius: 50%; background: var(--ice); opacity: .35; animation: fade .6s ease-out forwards; }
@keyframes fade { to { opacity: 0; transform: scale(.6); } }

/* C2 Gust: denser fine snow that streaks into lines while it rushes; a soft comet tail. */
.C2 .logo { font: italic 200 26px var(--head); letter-spacing: .2em; }
.C2 .trail { height: 10px; border-radius: 6px; background: linear-gradient(var(--tail-dir, 90deg), transparent, color-mix(in srgb, var(--ice) 60%, transparent)); animation: tail .5s ease-out forwards; }
@keyframes tail { to { opacity: 0; transform: scaleY(.3); } }

/* C3 Frost glass: clearer, lighter panels, so the snow shows through them too; dots of ice left on the floor. */
.C3 { --frost-mix: 45%; --blur: 10px; }
.C3 .bar, .C3 .status, .C3 .ctxline { background: color-mix(in srgb, #2a3140 45%, transparent); }
.C3 .logo { font: 400 24px var(--round); letter-spacing: .08em; color: var(--frost); text-shadow: 0 0 12px color-mix(in srgb, var(--ice) 60%, transparent); }
.C3 .trail { width: 6px; height: 6px; border-radius: 50%; background: var(--frost); opacity: .8; animation: melt 1.1s ease-out forwards; }
@keyframes melt { to { opacity: 0; transform: scale(.2); } }

/* C4 Breath: few big soft flakes, near-solid panels; the wordmark trails its own dots; puff rings behind a slide. */
.C4 { --frost-mix: 88%; --blur: 2px; }
.C4 .logo { font: 300 24px var(--round); display: inline-flex; align-items: baseline; gap: 2px; }
.C4 .logo .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ice); display: inline-block; animation: drift 2.4s ease-in-out infinite; }
.C4 .logo .dot:nth-of-type(2) { animation-delay: .2s; opacity: .7 } .C4 .logo .dot:nth-of-type(3) { animation-delay: .4s; opacity: .4 }
@keyframes drift { 50% { transform: translate(4px, -4px); } }
.C4 .trail { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--frost) 70%, transparent); animation: ring .7s ease-out forwards; }
@keyframes ring { to { opacity: 0; transform: scale(1.8); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 420px) { .room { grid-template-columns: repeat(7, 30px); grid-template-rows: repeat(4, 30px); } }
</style>

<main>
  <div>
    <h1>wee, Drift variants</h1>
    <p class="lede">All four keep the Manga form and pink for "on", with snow behind the shell. When the player slides, the snow gusts the same way for a moment. Each one plays by itself.</p>
  </div>
</main>

<script>
// Each variant: how much snow, flake sizes, how hard a gust pushes, whether flakes streak in a gust, and the slide's trail.
const VARIANTS = [
  { id: 'C1', name: 'Drift', say: 'The first sketch, with the gust added.', flakes: 40, size: [.4, 2], gust: 1, streak: false, trail: 'ghost', dots: false,
    notes: ['<b>Wordmark</b>: thin and spaced, a sheen passes over it.', '<b>Snow</b>: medium, drifts down, gusts with the slide.', '<b>Trail</b>: a fading ghost of the player.'] },
  { id: 'C2', name: 'Gust', say: 'Faster. More, finer snow that streaks into lines while it rushes.', flakes: 90, size: [.3, 1.2], gust: 2.2, streak: true, trail: 'tail', dots: false,
    notes: ['<b>Wordmark</b>: very thin italic, wide spacing.', '<b>Snow</b>: dense and fine; in a gust each flake becomes a short line.', '<b>Trail</b>: a soft comet tail that thins out.'] },
  { id: 'C3', name: 'Frost glass', say: 'Lighter. The panels are clearer glass, so the snow shows through them too.', flakes: 55, size: [.5, 2.2], gust: 1.3, streak: false, trail: 'dots', dots: false,
    notes: ['<b>Wordmark</b>: rounded, frost white with a cold glow.', '<b>Snow</b>: visible behind the bars as well as the room.', '<b>Trail</b>: little dots of ice left on the floor that melt.'] },
  { id: 'C4', name: 'Breath', say: 'Quieter. A few big soft flakes and almost solid panels; small, airy touches.', flakes: 16, size: [1.6, 3.4], gust: .8, streak: false, trail: 'ring', dots: true,
    notes: ['<b>Wordmark</b>: rounded "wee" trailing three dots that drift.', '<b>Snow</b>: few, big, slow; the gust nudges them.', '<b>Trail</b>: puff rings that open and fade.'] },
];
const layout = ['#######', '#.....#', '#.#...G', '#######'];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const main = document.querySelector('main');
const LEFT = 1, RIGHT = 5, ROW = 1;

for (const v of VARIANTS) {
  const sec = document.createElement('section'); sec.className = 'dir ' + v.id;
  const tiles = layout.map(r => [...r].map(c => `<div class="t${c === '#' ? ' w' : ''}${c === 'G' ? ' goal' : ''}">${c === 'G' ? '★' : ''}</div>`).join('')).join('');
  const logo = v.dots ? '<span class="logo">wee<i class="dot"></i><i class="dot"></i><i class="dot"></i></span>' : '<span class="logo">wee</span>';
  sec.innerHTML = `<header><h2>${v.id}. ${v.name}</h2><p>${v.say}</p></header>
    <div class="ed"><canvas class="snow"></canvas>
      <div class="bar">${logo}<button class="btn" type="button">Play</button><button class="btn" type="button">Check</button><button class="btn on" type="button">Lenses</button></div>
      <div class="ctxline">Laser turret · fires one way at a time, turning clockwise.</div>
      <div class="stage"><div class="room">${tiles}<div class="p"></div></div></div>
      <div class="chips"><span class="chip">Colour Off</span><span class="chip on">Dots Stops</span><span class="chip">Lines Off</span><span class="chip on">Frames Traps</span></div>
      <div class="status"><span class="led"></span><b>Solvable in 1 move.</b><button class="btn" type="button">Show solution</button><span>7×4</span></div>
    </div>
    <ul>${v.notes.map(n => `<li>${n}</li>`).join('')}</ul>`;
  main.append(sec);
  run(sec, v);
}

function run(sec, v) {
  const p = sec.querySelector('.p'), room = sec.querySelector('.room'), cv = sec.querySelector('.snow'), g = cv.getContext('2d');
  const step = () => (innerWidth <= 420 ? 32 : 36);
  const put = x => { p.style.left = (x * step() + 4) + 'px'; p.style.top = (ROW * step() + 4) + 'px'; };
  put(LEFT);
  // Snow positions are fractions of the card; wind is the push a gust adds, fading back to still.
  const flakes = Array.from({ length: v.flakes }, () => ({ x: Math.random(), y: Math.random(), r: v.size[0] + Math.random() * (v.size[1] - v.size[0]), fall: .0004 + Math.random() * .001, sway: Math.random() * 6 }));
  let wind = 0;
  const draw = t => {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, r.width, r.height);
    g.fillStyle = g.strokeStyle = 'rgba(234,246,255,.55)';
    for (const f of flakes) {
      if (!reduce) { f.y += f.fall; f.x += Math.sin(t / 1400 + f.sway) * .0003 + wind * f.r * .0016; if (f.y > 1) f.y -= 1; f.x = (f.x + 1) % 1; }
      const x = f.x * r.width, y = f.y * r.height;
      if (v.streak && Math.abs(wind) > .15) { g.lineWidth = f.r; g.beginPath(); g.moveTo(x, y); g.lineTo(x - wind * 14 * f.r, y); g.stroke(); }
      else { g.beginPath(); g.arc(x, y, f.r, 0, 7); g.fill(); }
    }
    wind *= .94;
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);

  let at = LEFT;
  const slide = () => {
    const s = step(), from = at, to = at === LEFT ? RIGHT : LEFT, n = Math.abs(to - from), dir = Math.sign(to - from), dur = v.id === 'C2' ? 520 : 900;
    p.style.transition = reduce ? 'none' : `left ${dur}ms cubic-bezier(.15,.7,.2,1)`; put(to); at = to;
    if (reduce) return;
    wind = dir * v.gust;
    if (v.trail === 'tail') { const k = document.createElement('i'); k.className = 'trail'; k.style.cssText = `left:${Math.min(from, to) * s + 8}px;top:${ROW * s + 12}px;width:${n * s}px;--tail-dir:${dir > 0 ? 90 : 270}deg`; room.append(k); setTimeout(() => k.remove(), 520); return; }
    for (let i = 1; i <= n; i++) setTimeout(() => {
      const k = document.createElement('i'); k.className = 'trail';
      const cx = (from + dir * (i - 1)) * s + 17, cy = ROW * s + 17;
      if (v.trail === 'ghost') k.style.cssText = `left:${cx - 13}px;top:${cy - 13}px`;
      if (v.trail === 'dots') k.style.cssText = `left:${cx - 3}px;top:${cy + 8}px`;
      if (v.trail === 'ring') k.style.cssText = `left:${cx - 10}px;top:${cy - 10}px`;
      room.append(k); setTimeout(() => k.remove(), 1200);
    }, dur * (i - 1) / n * .55);
  };
  const buttons = [...sec.querySelectorAll('.btn')];
  const press = () => { const b = buttons[Math.floor(Math.random() * buttons.length)]; b.classList.add('pressing'); setTimeout(() => b.classList.remove('pressing'), 260); };
  let beat = 0;
  const tick = () => { beat++; if (beat % 2) slide(); else press(); };
  if (!reduce) setTimeout(() => { tick(); setInterval(tick, 1500); }, 300 + VARIANTS.indexOf(v) * 250);
}
</script>
