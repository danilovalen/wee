# /etc/nginx/sites-available/wee  (then: ln -s ../sites-available/wee /etc/nginx/sites-enabled/)
# Certbot adds the https block: certbot --nginx -d wee.manganacarta.com
server {
    listen 80;
    server_name wee.manganacarta.com;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
